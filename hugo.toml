# Site
title = 'Muzic.Live'
baseURL = 'https://muzic.live/'
locale = 'fr-fr'
defaultContentLanguage = 'fr'
removePathAccents = true
enableRobotsTXT = true

[params]
  description = "Muzic.Live, le webzine des musiques actuelles : actualités, chroniques de concerts, critiques d'albums, festivals et artistes."
  images = ['logo-text.png']
  twitter = ''

# Taxonomies are disabled
[taxonomies]

# Services
[services]
  [services.googleAnalytics]
    id = 'G-HE90TD2KM0'
  [services.disqus]
    shortname = 'muzic-live'
  [services.rss]
    limit = 30

# Pagination
[pagination]
  pagerSize = 50

# Outputs
[outputs]
  home = ['html', 'rss']
  page = ['html']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

[outputFormats]
  [outputFormats.rss]
    baseName = "feed"
  [outputFormats.ics]
    baseName = "calendar"
    mediaType = 'text/calendar'

# Only artists and venues expose a calendar
[[cascade]]
  outputs = ['html']
  [cascade.target]
    path = '{/albums/**,/events/**,/festivals/**,/news/**,/reports/**}'

# Markup
[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
  block = true
