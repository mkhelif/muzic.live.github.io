# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs daily at 02:00
  schedule:
    - cron: "0 2 * * *"
      timezone: "Europe/Paris"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.2
      PAGEFIND_VERSION: 1.5.2
    steps:
      - name: Cache Hugo .deb
        id: hugo-deb
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo.deb
          key: hugo-deb-${{ env.HUGO_VERSION }}
      - name: Install Hugo CLI
        run: |
          if [ ! -f "${{ runner.temp }}/hugo.deb" ]; then
            wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          fi
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Cache Hugo resources
        uses: actions/cache@v6
        with:
          path: |
            resources/_gen
            ${{ runner.temp }}/hugo_cache
          key: hugo-resources-${{ hashFiles('assets/**') }}-${{ github.sha }}
          restore-keys: |
            hugo-resources-${{ hashFiles('assets/**') }}-
            hugo-resources-
      - name: Cache Pagefind binary
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: pagefind-${{ env.PAGEFIND_VERSION }}
          restore-keys: |
            pagefind-
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "https://muzic.live/" \
            --buildFuture
      - name: Build pagefind index
        run: |
          npx pagefind@${PAGEFIND_VERSION} --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
