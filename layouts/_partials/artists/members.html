{{- with .Params.members -}}
    <div id="members" class="my-4" data-pagefind-ignore="all">{{ partial "titles/h3.html" (dict "title" "Membres") }}</div>
    <div class="row row-cols-2 row-cols-md-5">
        {{- range $index, $member := . -}}
            {{/* Current members */}}
            {{- if eq (index .periods 0).end nil -}}
                <div class="col">
                    <div class="rounded overflow-hidden position-relative {{ cond (eq $index 0) "mb-3" "" }}" style="height:clamp(160px,21vw,235px);">
                        {{- partial "artists/member-hero.html" . -}}
                    </div>
                </div>
            {{- end -}}
        {{- end -}}
    </div>
{{- end -}}
